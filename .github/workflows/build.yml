name: Build NOVA OS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential xorriso curl tar xz-utils
      - name: Build bootable ISO
        run: bash scripts/build-iso.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-iso
          path: build/nova-os.iso
          if-no-files-found: error
